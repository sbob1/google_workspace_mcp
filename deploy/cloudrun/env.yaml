# Non-secret environment for the Cloud Run service.
# Secrets (client secret, JWT signing key) are injected from Secret Manager by deploy.sh.
# Reference: https://workspacemcp.com/docs/deployment

# --- Auth: multi-user OAuth 2.1 over streamable HTTP ---
MCP_ENABLE_OAUTH21: "true"
GOOGLE_OAUTH_CLIENT_ID: "459981624154-d5rvn4prcqcc7ttqaq6d73tduqll2qb3.apps.googleusercontent.com"
WORKSPACE_EXTERNAL_URL: "https://workspace-mcp-459981624154.us-central1.run.app"

# Only Claude (web/desktop/mobile) and Claude Code may register as clients.
WORKSPACE_MCP_ALLOWED_CLIENT_REDIRECT_URIS: "https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback,http://localhost:*/callback,http://127.0.0.1:*/callback"

# --- Container mode: no filesystem writes, no long-lived sessions ---
WORKSPACE_MCP_STATELESS_MODE: "true"
WORKSPACE_MCP_DISABLE_LOCAL_FILES: "true"

# OAuth proxy store survives restarts: Fernet-encrypted files on the GCS volume mount.
WORKSPACE_MCP_OAUTH_PROXY_STORAGE_BACKEND: "disk"
WORKSPACE_MCP_OAUTH_PROXY_DISK_DIRECTORY: "/data/oauth-proxy"

# Drive/Gmail downloads are staged in GCS and returned as 1-hour signed URLs.
WORKSPACE_MCP_FILES_GCS_BUCKET: "seanbob-ventures-mcp-files"

# --- Tools ---
WORKSPACE_MCP_TOOL_TIER: "complete"
# Off at launch (turn back on by removing from this list and redeploying):
#   Drive sharing changes, Apps Script execution and deployments.
WORKSPACE_MCP_DISABLED_TOOLS: "manage_drive_access,set_drive_file_permissions,run_script_function,manage_deployment"

# --- Misc ---
WORKSPACE_MCP_LOG_LEVEL: "INFO"
WORKSPACE_MCP_BRAND_NAME: "Seanbob Ventures Workspace"
