# Server behavior settings for the Cloud Run service.
# Identifiers (URL, client ID, buckets, mount path) come from config.sh and are added by
# deploy.sh; secrets come from Secret Manager. Why each setting: README.md → "Design choices".
# Reference: https://workspacemcp.com/docs/deployment

MCP_ENABLE_OAUTH21: "true"
WORKSPACE_MCP_STATELESS_MODE: "true"
WORKSPACE_MCP_DISABLE_LOCAL_FILES: "true"
WORKSPACE_MCP_OAUTH_PROXY_STORAGE_BACKEND: "disk"
WORKSPACE_MCP_OAUTH_PROXY_REFRESH_TOKEN_EXPIRY_SECONDS: "7776000"
WORKSPACE_MCP_ALLOWED_CLIENT_REDIRECT_URIS: "https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback,http://localhost:*/callback,http://127.0.0.1:*/callback"
WORKSPACE_MCP_TOOL_TIER: "complete"
WORKSPACE_MCP_DISABLED_TOOLS: "manage_drive_access,set_drive_file_permissions,run_script_function,manage_deployment,manage_script_trigger,search_custom,get_search_engine_info"
WORKSPACE_MCP_LOG_LEVEL: "INFO"
WORKSPACE_MCP_BRAND_NAME: "Seanbob Ventures Workspace"
